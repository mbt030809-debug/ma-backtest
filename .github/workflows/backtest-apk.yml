name: backtest-apk
on:
  push:
    branches: ['**']
    paths: ['backtest-app/**', '.github/workflows/backtest-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug --stacktrace
        working-directory: backtest-app
      - uses: actions/upload-artifact@v4
        with:
          name: BacktestApp-apk
          path: backtest-app/app/build/outputs/apk/debug/app-debug.apk
      # 앱의 '실행 시 업데이트 확인'이 읽는 공개 릴리스(latest): 빌드 번호와 APK를 매번 갱신
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/claude/backtest-app'
        with:
          tag_name: latest
          name: build ${{ github.run_number }}
          body: build=${{ github.run_number }}
          files: backtest-app/app/build/outputs/apk/debug/app-debug.apk
          target_commitish: ${{ github.sha }}
